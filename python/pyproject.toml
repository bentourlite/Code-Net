[project]
name = "codenet"
version = "0.1.0"
description = "Code Net: networked SMPTE LTC timecode for Ableton Live and Raspberry Pi receivers"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
pi = ["sounddevice>=0.4", "mido>=1.3", "python-rtmidi>=1.5"]
dev = ["pytest>=7"]

[project.scripts]
codenet-receiver = "codenet.receiver.main:main"
codenet-sender = "codenet.sender:main"
codenet-menu = "codenet.pi.menu:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["codenet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
